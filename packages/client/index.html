<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>화살표 탈출 미로</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #12121c;
        overscroll-behavior: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        touch-action: none;
        user-select: none;
      }

      [hidden] {
        display: none !important;
      }
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: rgba(18, 18, 28, 0.97);
        color: #e8eaf6;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      }
      #lobby .panel {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }
      #lobby h1 {
        margin: 0;
        font-size: 26px;
      }
      #lobby p {
        margin: 0;
        color: #a5adce;
      }
      #lobby input {
        font: inherit;
        font-size: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 2px solid #3d4266;
        background: #1c1d2e;
        color: #e8eaf6;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
      }
      #lobby input:focus {
        outline: none;
        border-color: #4c6ef5;
      }
      #lobby button {
        font: inherit;
        font-size: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        background: #4c6ef5;
        color: #fff;
        cursor: pointer;
      }
      #lobby button.secondary {
        background: #2b2f4a;
        color: #e8eaf6;
      }
      #lobby button.link {
        background: none;
        color: #a5adce;
        font-size: 14px;
        padding: 0;
        text-decoration: underline;
      }
      #lobby button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #lobby .error {
        color: #ff8787;
        font-size: 14px;
      }
      #lobby #lobby-status,
      #lobby .hint {
        font-size: 14px;
      }
      #lobby .notice {
        color: #ffd43b;
        font-size: 14px;
      }
      #lobby h2 {
        margin: 6px 0 0;
        font-size: 16px;
        color: #a5adce;
        text-align: left;
      }
      #room-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 40vh;
        overflow-y: auto;
      }
      #room-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px 8px 14px;
        border-radius: 10px;
        background: #1c1d2e;
      }
      #room-list .room-title {
        flex: 1;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #room-list .room-count {
        font-variant-numeric: tabular-nums;
        color: #a5adce;
      }
      #room-list button {
        font-size: 15px;
        padding: 8px 12px;
        min-width: 72px;
      }
      #room-count {
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #game-exit {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 5;
        font: inherit;
        font-size: 15px;
        padding: 8px 14px;
        border-radius: 10px;
        border: none;
        background: #2b2f4a;
        color: #e8eaf6;
        cursor: pointer;
      }
      #solo-time {
        font-size: 44px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #solo-stats {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
      }
      #solo-stats li {
        padding: 8px 12px;
        border-radius: 8px;
        background: #1c1d2e;
      }
      #result-score {
        font-size: 32px;
        font-weight: 700;
      }
      #result-rounds {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
      }
      #result-rounds li {
        padding: 8px 12px;
        border-radius: 8px;
        background: #1c1d2e;
      }
      #result-rounds li.won {
        border-left: 4px solid #37b24d;
      }
      #result-rounds li.lost {
        border-left: 4px solid #e03131;
      }
      #result-rounds li.draw {
        border-left: 4px solid #868e96;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="game-exit" type="button" hidden>나가기</button>
    <div id="lobby" hidden>
      <section id="lobby-idle" class="panel">
        <h1>화살표 탈출 미로</h1>
        <p>1대1 실시간 대전 · 3판 2선승</p>
        <form id="lobby-form" class="panel" autocomplete="off">
          <input id="lobby-name" type="text" placeholder="닉네임" aria-label="닉네임" />
          <div id="lobby-error" class="error" role="alert" hidden></div>
          <div id="lobby-notice" class="notice" role="status" hidden></div>
          <button id="lobby-create" type="submit">방 만들기</button>
        </form>
        <button id="lobby-solo-start" type="button" class="secondary">싱글 플레이 · 레벨 1</button>
        <button id="lobby-solo-reset" type="button" class="link" hidden>레벨 1부터 다시 시작</button>
        <h2>열린 방</h2>
        <ul id="room-list" aria-label="열린 방 목록"></ul>
        <p id="room-empty" class="hint">열린 방이 없습니다. 방을 만들어 보세요.</p>
        <p id="lobby-status" role="status"></p>
      </section>
      <section id="lobby-room" class="panel" hidden>
        <h1 id="room-title"></h1>
        <div id="room-count"></div>
        <p id="room-hint">상대를 기다리는 중…</p>
        <button id="room-leave" type="button" class="secondary">나가기</button>
      </section>
      <section id="lobby-result" class="panel" hidden>
        <h1 id="result-title"></h1>
        <div id="result-score"></div>
        <ol id="result-rounds"></ol>
        <p id="result-note" hidden></p>
        <p id="result-countdown" class="hint" role="status" hidden></p>
        <button id="result-rematch" type="button" hidden>다시 하기</button>
        <button id="result-leave" type="button" class="secondary">나가기</button>
      </section>
      <section id="lobby-solo" class="panel" hidden>
        <h1 id="solo-title"></h1>
        <div id="solo-time"></div>
        <ul id="solo-stats"></ul>
        <button id="solo-again" type="button">다시 하기</button>
        <button id="solo-lobby" type="button" class="secondary">로비로</button>
      </section>
      <section id="lobby-disconnected" class="panel" hidden>
        <h1>서버 연결이 끊어졌습니다</h1>
        <p>진행 중이던 대전은 종료되었습니다.</p>
        <button id="disconnected-lobby" type="button">로비로</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
