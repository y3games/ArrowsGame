# Pre-merge gate. `deploy.yml` runs the same checks on main, but only after a merge — too late
# to stop a broken change. This runs them on the pull request instead.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # Type-check passes in `check`; this catches bundling failures (client and server), which
      # a type-check cannot see.
      - run: npm run build
